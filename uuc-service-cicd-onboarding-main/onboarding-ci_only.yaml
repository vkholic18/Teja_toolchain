# CI/CD Onboarding Configuration — Profile: ci_only
# For detailed documentation, refer to: https://github.ibm.com/genctl-cicd/uuc-service-cicd-onboarding/blob/main/README.md
#
# Profile: ci_only
#   Internal artifacts not deployed to production (e.g. SDKs, libraries).
#   PR + CI pipeline with SAST, compliance checks, unit tests, and release process.
#   No inventory population and no CD pipeline.
#
# IMPORTANT: Team-level common data (FIDs, psirt_id, IBM Cloud accounts, secrets) must be
#   defined in commons.yaml — NOT in this file.
#
# Fields validated in this file:  service_name, cicd_profile,
#   compliance_bucket, app_repo, incident_repo,
#   slack_member_ids, slack_channel,
#   mandatory_files.CI (all 4 files), optional_files.mend
# Fields NOT required for this profile: inventory_repo, servicenow_crn,
#   mandatory_files.CD, deployment_targets
# Fields validated in commons.yaml: team_name, service_fid_dev/prod,
#   service_fid_dev/prod_github_username, psirt_id,
#   ibm_cloud_account_dev/prod, secrets.CI + common

version: 1.0

# Service name (must match filename: <service_name>-onboarding.yaml)
service_name: myservicename

# CI/CD Profile
cicd_profile: ci_only  # Required — allowed values: minimal | ci_only | ci_cd | cd_only

# Application repositories
app_repo:
  - repo: https://github.ibm.com/myorg/myrepo
    branch: main

# Incidents repository
# inventory_repo is NOT required for ci_only — only incident_repo is needed
#
# Access requirements:
#   create: false (existing repo)
#     - onepipelineci@ibm.com must have admin access
#     - service_fid_dev and service_fid_prod must have admin access
#   create: true (new repo — created by service_fid_dev)
#     - service_fid_dev must have org-level permission to create repositories
incident_repo:
  repo: https://github.ibm.com/myorg/myincidentrepo
  branch: main
  create: false

# Compliance evidence COS bucket
compliance_bucket:
  endpoint: https://s3.eu-gb.cloud-object-storage.appdomain.cloud
  name: my_bucket
  use_existing: false

# Slack Notifications for Secrets Management (service-specific)
slack_member_ids:
  - U01234ABCDE  # Example - replace with your Slack member ID
  - U56789FGHIJ  # Example - replace with your Slack member ID

# Slack Channel for Notifications (service-specific, optional)
slack_channel: "#my-team-alerts"

# Mandatory Files Configuration
# All 4 CI files are enforced; CD group is NOT required for ci_only
mandatory_files:
  - name: CI
    repo: https://github.ibm.com/myorg/myrepo
    branch: main
    files:
      # DO NOT MODIFY - PLATFORM MANAGED: Build script for CI pipeline
      - path: hack/ci/build.sh
        can_be_empty: false
        executable: true
      # DO NOT MODIFY - PLATFORM MANAGED: Unit test execution script
      - path: hack/ci/run-unit-tests.sh
        can_be_empty: false
        executable: true
      # DO NOT MODIFY - PLATFORM MANAGED: Build metadata
      - path: hack/ci/build-meta.yaml
        can_be_empty: false
        executable: false
      # DO NOT MODIFY - PLATFORM MANAGED: Pipeline configuration
      - path: hack/ci/pipeline.yaml
        can_be_empty: false
        executable: false

# Optional Files Configuration
optional_files:
  - name: mend
    repo: https://github.ibm.com/myorg/myrepo
    branch: main
    files:
      # Mend SAST suppressions file
      - path: mend-suppressions.json
        can_be_empty: true
        executable: false
